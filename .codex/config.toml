default_permissions = "workspace-only"

[features]
network_proxy = true

[permissions.workspace-only]
extends = ":workspace"

[permissions.workspace-only.filesystem]
":root" = "read"
":minimal" = "read"

[permissions.workspace-only.network]
enabled = true

[permissions.workspace-only.network.domains]
"*" = "allow"
"localhost" = "allow"
